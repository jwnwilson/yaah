apiVersion: v1
kind: Service
metadata:
  name: yaah-litellm
spec:
  selector:
    app: yaah-litellm
  ports:
    - protocol: TCP
      port: 4000
      targetPort: 4000
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: yaah-litellm
  labels:
    app: yaah-litellm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: yaah-litellm
  template:
    metadata:
      labels:
        app: yaah-litellm
    spec:
      containers:
        - name: litellm
          image: ghcr.io/berriai/litellm:main-v1.55.8
          args: ["--config", "/app/config.yaml", "--port", "4000"]
          ports:
            - containerPort: 4000
          env:
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: yaah-secrets
                  key: anthropic-api-key
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: yaah-secrets
                  key: litellm-master-key
          volumeMounts:
            - name: config
              mountPath: /app/config.yaml
              subPath: config.yaml
          readinessProbe:
            httpGet:
              path: /health/liveliness
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 15
      volumes:
        - name: config
          configMap:
            name: yaah-litellm-config
