apiVersion: apps/v1
kind: Deployment
metadata:
  name: yaah-api
  labels:
    app: yaah-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: yaah-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: yaah-api
    spec:
      imagePullSecrets:
        - name: ecr-credentials
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      containers:
        - name: yaah-api
          image: <ECR_API_IMAGE>
          ports:
            - containerPort: 8000
          env:
            - name: YAAH_PROFILE
              value: remote
            - name: YAAH_AUTH_MODE
              value: dev
            - name: YAAH_TEMPORAL_ADDRESS
              value: yaah-temporal:7233
            - name: YAAH_LITELLM_BASE_URL
              value: http://yaah-litellm:4000
            - name: YAAH_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: yaah-db-secret
                  key: database-url
            - name: YAAH_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: yaah-secrets
                  key: secret-key
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 6
