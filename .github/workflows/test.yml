name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Set up Python
        run: uv python install 3.12
      - name: Sync deps
        run: uv sync --frozen
      - name: Run tests
        run: uv run pytest

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: ui/pnpm-lock.yaml
      - name: Install
        working-directory: ui
        run: pnpm install --frozen-lockfile
      - name: Type-check
        working-directory: ui
        run: pnpm lint
      - name: Unit tests
        working-directory: ui
        run: pnpm test
