services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: yaah
      POSTGRES_PASSWORD: yaah
      POSTGRES_DB: yaah
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yaah"]
      interval: 5s
      timeout: 3s
      retries: 10

  temporal:
    image: temporalio/admin-tools:1.25
    # admin-tools' default entrypoint is `tini -- sleep infinity`, which would swallow the
    # command below; override it so `temporal server start-dev` is actually executed.
    entrypoint: ["temporal"]
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--db-filename", "/data/temporal.db"]
    # admin-tools runs as a non-root user that cannot write the root-owned named volume;
    # run as root so start-dev can create /data/temporal.db.
    user: root
    ports:
      - "7233:7233"
      - "8233:8233"   # Web UI
    volumes:
      - temporaldata:/data
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "127.0.0.1:7233"]
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    build: { context: ., dockerfile: infra/worker/Dockerfile }
    depends_on: [postgres, temporal]
    environment:
      YAAH_DATABASE_URL: postgresql+psycopg://yaah:yaah@postgres:5432/yaah
      YAAH_TEMPORAL_ADDRESS: temporal:7233
      YAAH_PROFILE: ${YAAH_PROFILE:-local}
      YAAH_AGENT_RUNTIME: ${YAAH_AGENT_RUNTIME:-auto}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - workspaces:/app/data/workspaces
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 4g
    pids_limit: 512
    restart: unless-stopped

  litellm:
    image: ghcr.io/berriai/litellm:main-v1.55.8
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    ports:
      - "4000:4000"
    volumes:
      - ./infra/litellm/config.yaml:/app/config.yaml:ro
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-yaah-local}
    restart: unless-stopped

volumes:
  pgdata:
  temporaldata:
  workspaces:
