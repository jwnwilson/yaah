[project]
name = "yaah"
version = "0.1.0"
description = "Agent harness: virtual dev teams driven from a task board"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "temporalio>=1.7",
    "httpx>=0.27",
    "pyjwt[crypto]>=2.9",
    "alembic>=1.18.4",
]

[dependency-groups]
dev = ["pytest>=8.3", "httpx>=0.27", "pytest-cov>=5.0", "ruff>=0.7", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]
